[project]
name = "video-notes"
version = "0.1.0"
description = "Turn Bilibili videos into structured study notes with slides"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pillow>=10.0",
  "qrcode>=7.4",
  "yt-dlp>=2024.12.13",
  "websocket-client>=1.7",
  "dashscope>=1.20",
  "markdown>=3.6",
]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.7"]
dev = ["imageio-ffmpeg>=0.6"]

[project.scripts]
vnote = "video_notes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_notes"]